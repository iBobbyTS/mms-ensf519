<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.textDirection%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
		<link rel="icon" href="/favicon-48x48.png" type="image/png" sizes="48x48" />
		<link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-120x120.png" sizes="120x120" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-152x152.png" sizes="152x152" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-167x167.png" sizes="167x167" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#0f3d63" />
		<meta name="msapplication-TileColor" content="#0f3d63" />
		<meta name="msapplication-TileImage" content="/mstile-150x150.png" />
		<meta name="msapplication-config" content="/browserconfig.xml" />
		<script>
			(() => {
				const storageKey = "scsc-theme-preference";
				const storedPreference = localStorage.getItem(storageKey);
				const resolvedTheme =
					storedPreference === "light" || storedPreference === "dark"
						? storedPreference
						: window.matchMedia("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light";

				document.documentElement.dataset.theme = resolvedTheme;
				document.documentElement.style.colorScheme = resolvedTheme;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
